changelog:
  exclude:
    labels:
      - autorelease: pending
      - autorelease: tagged
      - autorelease: snapshot
      - autorelease: published
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - '*'
