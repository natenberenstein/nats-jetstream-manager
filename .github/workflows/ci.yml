name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0
  NODE_VERSION: 20

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      docker_backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker_backend == 'true' }}
      docker_frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker_frontend == 'true' }}
      format: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.format == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      helm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.helm == 'true' }}
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            docker_backend:
              - 'backend/**'
              - 'backend/Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            docker_frontend:
              - 'frontend/**'
              - 'frontend/Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            format:
              - '.prettierignore'
              - '.prettierrc'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.json'
              - '**/*.css'
              - '**/*.md'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            helm:
              - 'helm/**'
              - '.github/workflows/**'
            workflows:
              - '.github/**/*.yml'
              - '.github/**/*.yaml'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.format == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check source formatting
        run: npm run format:check

      - name: Check workflow formatting
        if: needs.changes.outputs.workflows == 'true'
        run: npm exec prettier -- --check ".github/**/*.{yml,yaml}"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace=backend --include-workspace-root

      - name: Lint backend
        run: npm run lint:check --workspace=backend

      - name: Test backend
        run: npm run test --workspace=backend

      - name: Build backend
        run: npm run build --workspace=backend

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace=frontend --include-workspace-root

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: >-
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json',
            'frontend/package.json') }}-${{ hashFiles('frontend/src/**/*',
            'frontend/public/**/*', 'frontend/next.config.*',
            'frontend/postcss.config.*', 'frontend/tailwind.config.*',
            'frontend/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'frontend/package.json') }}-

      - name: Lint frontend
        run: npm run lint:check --workspace=frontend

      - name: Build frontend
        run: npm run build --workspace=frontend

  helm:
    name: Helm (${{ matrix.render.name }})
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        render:
          - name: defaults
            args: ''
          - name: postgres
            args: >-
              --set backend.config.databaseType=postgres
              --set backend.postgresql.host=postgres.example.com
              --set backend.secrets.databasePassword=test-password
          - name: ingress
            args: >-
              --set ingress.enabled=true
              --set ingress.frontend.host=app.example.com
              --set ingress.backend.host=api.example.com
          - name: autoscaling
            args: >-
              --set backend.config.databaseType=postgres
              --set backend.postgresql.host=postgres.example.com
              --set backend.secrets.databasePassword=test-password
              --set backend.persistence.enabled=false
              --set backend.autoscaling.enabled=true
              --set frontend.autoscaling.enabled=true
          - name: network-policy
            args: --set networkPolicy.enabled=true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: Lint chart
        run: helm lint helm/nats-jetstream-manager

      - name: Render chart
        run: helm template test helm/nats-jetstream-manager ${{ matrix.render.args }} > /tmp/rendered-chart.yaml

      - name: Verify default image repositories
        run: |
          grep -F "image: natenberenstein/nats-jetstream-manager-backend:" /tmp/rendered-chart.yaml
          grep -F "image: natenberenstein/nats-jetstream-manager-frontend:" /tmp/rendered-chart.yaml

  docker_backend:
    name: Docker (backend)
    needs: changes
    if: needs.changes.outputs.docker_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build backend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: nats-jetstream-manager-backend:ci
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

  docker_frontend:
    name: Docker (frontend)
    needs: changes
    if: needs.changes.outputs.docker_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build frontend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: nats-jetstream-manager-frontend:ci
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

  ci-result:
    name: CI Result
    needs:
      - changes
      - format
      - backend
      - frontend
      - helm
      - docker_backend
      - docker_frontend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes job result was ${{ needs.changes.result }}" >&2
            exit 1
          fi

          for result in \
            "${{ needs.format.result }}" \
            "${{ needs.backend.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.helm.result }}" \
            "${{ needs.docker_backend.result }}" \
            "${{ needs.docker_frontend.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A CI job finished with result: $result" >&2
              exit 1
            fi
          done
