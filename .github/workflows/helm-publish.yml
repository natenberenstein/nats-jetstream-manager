name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Chart version to publish (e.g. 1.2.3)
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: helm/nats-jetstream-manager
  OCI_REPO: oci://registry-1.docker.io/natenberenstein

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.2

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${{ github.event.release.tag_name }}"
          fi

          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Unable to resolve chart version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify chart version
        shell: bash
        run: |
          chart_version="$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | head -n1 | cut -d: -f2- | xargs)"
          app_version="$(grep -E '^appVersion:' "$CHART_DIR/Chart.yaml" | head -n1 | cut -d: -f2- | xargs)"
          chart_version="${chart_version%\"}"
          chart_version="${chart_version#\"}"
          app_version="${app_version%\"}"
          app_version="${app_version#\"}"

          if [[ "$chart_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Chart version $chart_version does not match release ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

          if [[ "$app_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Chart appVersion $app_version does not match release ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Login to Docker Hub (OCI)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" -d dist

      - name: Push chart
        run: |
          CHART_PKG=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          helm push "$CHART_PKG" "$OCI_REPO"

      - name: Logout
        if: always()
        run: helm registry logout registry-1.docker.io || true
