name: helm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Chart version to publish (e.g. 1.2.3)
        required: true
      ref:
        description: Git ref to checkout (defaults to v<tag>)
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: helm/nats-jetstream-manager
  HELM_REPO_URL: https://natenberenstein.github.io/nats-jetstream-manager
  OCI_REPO: oci://registry-1.docker.io/natenberenstein

jobs:
  publish-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${INPUT_TAG:-$RELEASE_TAG}"
          version="${version#refs/tags/}"
          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Unable to resolve chart version" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Chart version must be a SemVer version without build metadata" >&2
            exit 1
          fi

          if [[ -n "$INPUT_REF" ]]; then
            checkout_ref="$INPUT_REF"
          elif [[ -n "$RELEASE_TAG" ]]; then
            checkout_ref="$RELEASE_TAG"
          else
            checkout_ref="v$version"
          fi

          if [[ ! "$checkout_ref" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "Checkout ref contains unsupported characters" >&2
            exit 1
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.2

      - name: Verify chart version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chart_version="$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | head -n1 | cut -d: -f2- | xargs)"
          app_version="$(grep -E '^appVersion:' "$CHART_DIR/Chart.yaml" | head -n1 | cut -d: -f2- | xargs)"
          chart_version="${chart_version%\"}"
          chart_version="${chart_version#\"}"
          app_version="${app_version%\"}"
          app_version="${app_version#\"}"

          if [[ "$chart_version" != "$EXPECTED_VERSION" ]]; then
            echo "Chart version $chart_version does not match release $EXPECTED_VERSION" >&2
            exit 1
          fi

          if [[ "$app_version" != "$EXPECTED_VERSION" ]]; then
            echo "Chart appVersion $app_version does not match release $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Login to Docker Hub (OCI)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" -d dist

      - name: Push chart
        run: |
          CHART_PKG=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          helm push "$CHART_PKG" "$OCI_REPO"

      - name: Publish chart repository
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add pages FETCH_HEAD
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . || true
          fi

          cp dist/*.tgz pages/

          if [[ -f pages/index.yaml ]]; then
            helm repo index pages --url "$HELM_REPO_URL" --merge pages/index.yaml
          else
            helm repo index pages --url "$HELM_REPO_URL"
          fi

          touch pages/.nojekyll
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add .

          if git -C pages diff --cached --quiet; then
            echo "Helm repository already contains chart ${{ steps.version.outputs.version }}"
          else
            git -C pages commit -m "Publish nats-jetstream-manager chart ${{ steps.version.outputs.version }}"
            git -C pages push origin HEAD:gh-pages
          fi

      - name: Logout
        if: always()
        run: helm registry logout registry-1.docker.io || true
