name: docker-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 1.2.3)
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            dockerfile: ./backend/Dockerfile
            image: natenberenstein/nats-jetstream-manager-backend
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            image: natenberenstein/nats-jetstream-manager-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker tags
        id: docker_tags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.tag }}"
          else
            version="${{ github.event.release.tag_name }}"
          fi

          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Unable to resolve Docker image tag" >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            echo "${{ matrix.component.image }}:${version}"

            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${{ matrix.component.image }}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              echo "${{ matrix.component.image }}:${BASH_REMATCH[1]}"
            fi

            if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.prerelease }}" != "true" ]]; then
              echo "${{ matrix.component.image }}:latest"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}
