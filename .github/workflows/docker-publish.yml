name: release-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 1.2.3)
        required: true
      ref:
        description: Git ref to checkout (defaults to v<tag>)
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CHART_DIR: helm/nats-jetstream-manager
  HELM_REPO_URL: https://natenberenstein.github.io/nats-jetstream-manager
  OCI_REPO: oci://registry-1.docker.io/natenberenstein

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
      is_latest: ${{ steps.version.outputs.is_latest }}
      is_stable_semver: ${{ steps.version.outputs.is_stable_semver }}
      semver: ${{ steps.version.outputs.semver }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_TAG"
          else
            version="$RELEASE_TAG"
          fi

          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Unable to resolve Docker image tag" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Docker image tag must be a SemVer version without build metadata" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_REF" ]]; then
            checkout_ref="$INPUT_REF"
          else
            checkout_ref="v$version"
          fi

          if [[ ! "$checkout_ref" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "Checkout ref contains unsupported characters" >&2
            exit 1
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "semver=v$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable_semver=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" == "release" && "$RELEASE_PRERELEASE" != "true" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: backend
            dockerfile: ./backend/Dockerfile
            image: natenberenstein/nats-jetstream-manager-backend
          - name: frontend
            dockerfile: ./frontend/Dockerfile
            image: natenberenstein/nats-jetstream-manager-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.component.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-version.outputs.semver }},enable=${{ needs.resolve-version.outputs.is_stable_semver == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.resolve-version.outputs.semver }},enable=${{ needs.resolve-version.outputs.is_stable_semver == 'true' }}
            type=raw,value=latest,enable=${{ needs.resolve-version.outputs.is_latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.name }}

  publish-chart:
    name: Publish Helm chart
    needs:
      - resolve-version
      - build-push
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2

      - name: Verify chart version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          chart_version="$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | head -n1 | cut -d: -f2- | xargs)"
          app_version="$(grep -E '^appVersion:' "$CHART_DIR/Chart.yaml" | head -n1 | cut -d: -f2- | xargs)"
          chart_version="${chart_version%\"}"
          chart_version="${chart_version#\"}"
          app_version="${app_version%\"}"
          app_version="${app_version#\"}"

          if [[ "$chart_version" != "$EXPECTED_VERSION" ]]; then
            echo "Chart version $chart_version does not match release $EXPECTED_VERSION" >&2
            exit 1
          fi

          if [[ "$app_version" != "$EXPECTED_VERSION" ]]; then
            echo "Chart appVersion $app_version does not match release $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Login to Docker Hub (OCI)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" -d dist

      - name: Push chart
        run: |
          CHART_PKG=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          helm push "$CHART_PKG" "$OCI_REPO"

      - name: Publish chart repository
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add pages FETCH_HEAD
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . || true
          fi

          cp dist/*.tgz pages/

          if [[ -f pages/index.yaml ]]; then
            helm repo index pages --url "$HELM_REPO_URL" --merge pages/index.yaml
          else
            helm repo index pages --url "$HELM_REPO_URL"
          fi

          touch pages/.nojekyll
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add .

          if git -C pages diff --cached --quiet; then
            echo "Helm repository already contains chart ${{ needs.resolve-version.outputs.version }}"
          else
            git -C pages commit -m "Publish nats-jetstream-manager chart ${{ needs.resolve-version.outputs.version }}"
            git -C pages push origin HEAD:gh-pages
          fi

      - name: Logout
        if: always()
        run: helm registry logout registry-1.docker.io || true
